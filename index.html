<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure WildWhim - Cat's Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Character Select Overlay (Appears at start) -->
    <div id="character-select" class="overlay">
        <div class="modal-box">
            <h2>🐾 Choose Your Adventure Kitty</h2>
            <p>Select your companion for the mushroom hunt:</p>
            <div id="cat-grid">
                <div class="cat-card" onclick="selectCat('Mochi', '#f5e1da', '#d48c82')">
                    <div class="cat-preview" style="background: #f5e1da;"></div>
                    <span>Mochi</span><small>Beret & Scarf</small>
                </div>
                <div class="cat-card" onclick="selectCat('Nori', '#3d3b4f', '#7d79a0')">
                    <div class="cat-preview" style="background: #3d3b4f;"></div>
                    <span>Nori</span><small>Wizard Cape</small>
                </div>
                <div class="cat-card" onclick="selectCat('Latte', '#d9a066', '#8c5828')">
                    <div class="cat-preview" style="background: #d9a066;"></div>
                    <span>Latte</span><small>Knitted Vest</small>
                </div>
                <div class="cat-card" onclick="selectCat('Matcha', '#b5c99a', '#5a7342')">
                    <div class="cat-preview" style="background: #b5c99a;"></div>
                    <span>Matcha</span><small>Twin Buns</small>
                </div>
                <div class="cat-card" onclick="selectCat('Taro', '#d1c4e9', '#7e57c2')">
                    <div class="cat-preview" style="background: #d1c4e9;"></div>
                    <span>Taro</span><small>Star Glasses</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Cozy HUD -->
    <div id="hud">
        <div class="hud-item">🐱 <span id="selected-cat-name">Mochi</span></div>
        <div class="hud-item">🍄 Mushrooms: <span id="shroom-val">0</span>/5</div>
        <div class="hud-item">✨ Level: <span id="level-val">1</span>/20</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Super Simple Touch Controls -->
    <div id="controls-container">
        <div id="left-controls">
            <button class="sketch-btn" id="btn-left">◀</button>
            <button class="sketch-btn" id="btn-right">▶</button>
        </div>
        <div id="right-controls">
            <button class="sketch-btn action" id="btn-jump">🦘 Jump</button>
            <button class="sketch-btn action" id="btn-boop">🐾 Boop!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
